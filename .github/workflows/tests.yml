name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: siakad_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Import database
        run: mysql -h127.0.0.1 -uroot -proot siakad_test < database/siakad-st.sql

      - name: Run migrations
        env:
          CI_ENVIRONMENT: development
          database.default.hostname: 127.0.0.1
          database.default.database: siakad_test
          database.default.username: root
          database.default.password: root
          database.default.DBDriver: MySQLi
        run: php spark migrate --all

      - name: PHPUnit
        env:
          database.tests.hostname: 127.0.0.1
          database.tests.database: siakad_test
          database.tests.username: root
          database.tests.password: root
          database.tests.DBDriver: MySQLi
          database.tests.DBPrefix: ''
        run: vendor/bin/phpunit --no-coverage
